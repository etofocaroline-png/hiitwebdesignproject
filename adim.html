<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel - AUI Lost & Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--aui-blue:#0d1b4a;--aui-gold:#fca311;--light:#f8f9fc}
body{font-family:'Segoe UI',sans-serif;background:radial-gradient(circle at top,#eef4ff,#f8f9fc 45%,#edf2ff);color:#12203d}
.admin-sidebar{background:linear-gradient(180deg,#0d1b4a,#142d6d);min-height:100vh;color:white;padding:20px;box-shadow:15px 0 30px rgba(13,27,74,.08);position:relative;overflow:hidden}
.admin-sidebar::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(252,163,17,.12),transparent);pointer-events:none}
.admin-sidebar a{color:rgba(255,255,255,.8);text-decoration:none;display:block;padding:12px 14px;border-radius:10px;transition:all .25s ease;position:relative;z-index:1}
.admin-sidebar a.active,.admin-sidebar a:hover{color:#fca311;background:rgba(255,255,255,.04);transform:translateX(4px)}
.stat-card{background:white;border-radius:12px;padding:20px;text-align:center;box-shadow:0 10px 24px rgba(13,27,74,.08);animation:riseIn .65s ease both;transition:transform .25s ease}
.stat-card:hover{transform:translateY(-4px) scale(1.01)}
.card{border:none;border-radius:16px;box-shadow:0 8px 22px rgba(13,27,74,.06);animation:riseIn .7s ease both}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 28px rgba(13,27,74,.12)}
.btn{transition:transform .2s ease, box-shadow .2s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 18px rgba(13,27,74,.12)}
@keyframes riseIn{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
</style></head>
<body>
<div class="container-fluid"><div class="row">
<div class="col-md-3 col-lg-2 admin-sidebar">
<h5 class="fw-bold"><i class="bi bi-shield-lock text-warning"></i> AUI Admin</h5><hr>
<a href="#" class="active"><i class="bi bi-grid"></i> Dashboard</a>
<a href="index.html"><i class="bi bi-box"></i> View Site</a>
<a href="#" onclick="localStorage.clear();location='login.html'"><i class="bi bi-box-arrow-left"></i> Logout</a>
</div>
<div class="col-md-9 col-lg-10 p-4">
<h3 class="fw-bold">Dashboard</h3><p class="text-muted">Manage all reports</p>
<div class="row g-3 mb-4">
<div class="col-6 col-md-3"><div class="stat-card"><h4 id="tCount">0</h4><small>Total</small></div></div>
<div class="col-6 col-md-3"><div class="stat-card"><h4 id="lCount" class="text-danger">0</h4><small>Lost</small></div></div>
<div class="col-6 col-md-3"><div class="stat-card"><h4 id="fCount" class="text-success">0</h4><small>Found</small></div></div>
<div class="col-6 col-md-3"><div class="stat-card"><h4 id="cCount">0</h4><small>Pending</small></div></div>
</div>
<div class="card border-0 shadow-sm"><div class="card-body">
<div class="d-flex justify-content-between mb-3"><h6 class="fw-bold">Recent Reports</h6><button class="btn btn-sm btn-dark" onclick="clearAll()">Clear All</button></div>
<div class="table-responsive"><table class="table"><thead><tr><th>Type</th><th>Item</th><th>Location</th><th>Date</th><th>Contact</th><th>Action</th></tr></thead><tbody id="adminTable"></tbody></table></div>
</div></div></div></div></div>
<script>
let items=JSON.parse(localStorage.getItem('aui_items')||'null')||[{id:1,type:'lost',name:'ID Card - ETOFO O.C',location:'CONVO',date:'2025-09-20',contact:'080786532'},{id:2,type:'found',name:'Power Bank',location:'Library',date:'2025-09-22',contact:'Security'}];
function renderAdmin(){document.getElementById('adminTable').innerHTML=items.map(i=>`<tr><td><span class="badge ${i.type==='lost'?'bg-danger':'bg-success'}">${i.type}</span></td><td>${i.name}</td><td>${i.location}</td><td>${i.date}</td><td>${i.contact}</td><td><button class="btn btn-sm btn-outline-success" onclick="alert('Approved!')">Approve</button> <button class="btn btn-sm btn-outline-danger" onclick="del(${i.id})">Delete</button></td></tr>`).join('');document.getElementById('tCount').innerText=items.length;document.getElementById('lCount').innerText=items.filter(x=>x.type==='lost').length;document.getElementById('fCount').innerText=items.filter(x=>x.type==='found').length;document.getElementById('cCount').innerText=items.length;}
function del(id){items=items.filter(x=>x.id!==id);localStorage.setItem('aui_items',JSON.stringify(items));renderAdmin();}
function clearAll(){if(confirm('Clear all?')){items=[];localStorage.setItem('aui_items',JSON.stringify(items));renderAdmin();}}
if(localStorage.getItem('aui_role')!=='admin'){alert('Admin only! Use admin@aui.edu.ng / admin123');location='login.html';}
renderAdmin();
</script>
</body></html>
