<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - AUI Lost & Found</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--aui-blue:#0d1b4a;--aui-gold:#fca311;--light:#f8f9fc}
body{font-family:'Segoe UI',sans-serif;background:radial-gradient(circle at top,#eef4ff,#f8f9fc 45%,#edf2ff);position:relative;overflow:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:rgba(13,27,74,.08);filter:blur(25px);z-index:0;animation:float 9s ease-in-out infinite}
body::before{width:220px;height:220px;top:8%;left:8%}
body::after{width:260px;height:260px;right:10%;bottom:12%;animation-delay:1s}
.navbar{background:rgba(13,27,74,.96)!important;backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(13,27,74,.12);position:relative;z-index:1}
.auth-card{max-width:420px;margin:60px auto;background:rgba(255,255,255,.92);border-radius:22px;padding:30px;box-shadow:0 18px 44px rgba(13,27,74,.12);backdrop-filter:blur(8px);position:relative;z-index:1;animation:riseIn .7s ease both}
.auth-card:hover{transform:translateY(-4px);box-shadow:0 22px 52px rgba(13,27,74,.17)}
.form-control{border-radius:12px;padding:12px 14px;transition:all .2s ease}
.form-control:focus{border-color:rgba(13,27,74,.5);box-shadow:0 0 0 .2rem rgba(13,27,74,.12)}
.btn-dark{border-radius:12px;padding:12px;box-shadow:0 12px 20px rgba(13,27,74,.15);transition:transform .2s ease, box-shadow .2s ease}
.btn-dark:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 16px 26px rgba(13,27,74,.18)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes riseIn{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
</style></head>
<body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-search text-warning"></i> AUI Lost & Found</a></div></nav>
<div class="auth-card">
<h4 class="fw-bold text-center">Welcome Back</h4><p class="text-muted text-center small">Login to manage lost & found</p>
<form id="loginForm" onsubmit="login(event)">
<div class="mb-3"><label>Email / Matric No</label><input type="text" id="email" class="form-control" placeholder="e.g. AU/2023/1234"></div>
<div class="mb-3"><label>Password</label><input type="password" id="pass" class="form-control"></div>
<button class="btn btn-dark w-100 py-2 fw-bold">Login <i class="bi bi-box-arrow-in-right"></i></button>
<div class="text-center mt-3 small">Test login:<br><b>Admin:</b> admin@aui.edu.ng / admin123<br><b>Student:</b> student@aui.edu.ng / student123</div>
<div class="text-center mt-3"><a href="index.html" class="text-muted"><i class="bi bi-arrow-left"></i> Back to Home</a></div>
</form>
</div>
<script>
function login(e){
e.preventDefault();
const em=document.getElementById('email').value.trim().toLowerCase();
const ps=document.getElementById('pass').value;
if(!em||em.length<4||em.length>100||!ps||ps.length<8||ps.length>100){alert('Please enter a valid email and password.');return;}
if(em==='admin@aui.edu.ng'&&ps==='admin123'){localStorage.setItem('aui_role','admin');window.location='adim.html';}
else if(em==='student@aui.edu.ng'&&ps==='student123'){localStorage.setItem('aui_role','student');window.location='index.html';}
else alert('Invalid email or password.');
}
</script>
</body></html>
